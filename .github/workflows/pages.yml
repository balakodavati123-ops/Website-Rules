# Publishes the page itself (docs/index.html with docs/floor.js and docs/candles.js). The live numbers do not go through here: the page reads them from the data branch.
name: pages
on:
  push:
    paths: ["docs/index.html", "docs/floor.js", "docs/candles.js", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir -p site && cp docs/index.html site/index.html && cp docs/floor.js docs/candles.js site/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - run: sleep 8          # the uploaded artifact can take a few seconds to become visible to the deploy step
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'          # one retry: the first attempt sometimes sees "0 artifacts"
        run: sleep 25
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
