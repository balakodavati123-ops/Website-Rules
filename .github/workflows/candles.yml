# Daily candles for every NSE stock, and every NIFTY 50 one-minute candle since January 2022 (one SQLite database for backtesting),
# saved on the `charts` branch so the page can draw or download them.
# Upstox allows about 2,000 history calls per 30 minutes, so a full refresh takes several runs; each run continues
# where the last stopped and starts the next one itself until every stock is current.
name: candles
on:
  schedule:
    - cron: "40 10 * * 1-5"       # 16:10 IST, after the close
  workflow_dispatch:
concurrency:
  group: candles
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Start from the files already published
        run: |
          mkdir -p /tmp/charts
          git fetch -q --depth=1 origin charts 2>/dev/null && git archive FETCH_HEAD | tar -x -C /tmp/charts || true
      - name: NIFTY 50 one-minute database for backtesting (nifty50_1m.sqlite, only what is new)
        continue-on-error: true            # never hold up the stock candles
        run: python backend/nifty_db.py /tmp/charts
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
      - run: python backend/candles.py /tmp/charts
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          MAX_MINUTES: "55"
      - name: Publish to the charts branch
        run: |
          cd /tmp/charts && rm -rf .git && git init -q && git add -A
          git -c user.name=desk-bot -c user.email=desk-bot@users.noreply.github.com commit -q -m "daily candles"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/charts
      - name: Continue if stocks remain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(cat /tmp/charts/remaining.txt)" -gt 0 ]; then gh workflow run candles.yml --ref "${{ github.ref_name }}"; fi
