# Intraday paper desk: every 5 minutes in NSE hours (Mon-Fri). No Claude, no browser needed.
name: market-hours
on:
  schedule:
    - cron: "*/5 3-18 * * 1-5"     # 08:30 to 23:59 IST on weekdays: equities, F&O, MCX and crypto; each desk keeps its own hours
    - cron: "0 * * * 0,6"          # weekends: crypto only
  workflow_dispatch:
concurrency:
  group: desk
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Skip outside market hours
        id: gate
        run: echo "go=yes" >> $GITHUB_OUTPUT        # every desk decides for itself whether its market is open
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with: { python-version: "3.11", cache: pip }
      - if: steps.gate.outputs.go == 'yes'
        run: pip install -q yfinance pandas numpy
      - if: steps.gate.outputs.go == 'yes'
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          LOOP_SECONDS: "240"
        run: python backend/engine.py
      - name: Save the data
        if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || { git commit -q -m "data: market-hours run"; for i in 1 2 3; do git pull -q --rebase && git push -q && break || sleep 5; done; }
      - uses: actions/configure-pages@v5
        continue-on-error: true
        if: steps.gate.outputs.go == 'yes'
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        if: steps.gate.outputs.go == 'yes'
        with: { path: docs }
      - id: deploy
        continue-on-error: true
        if: steps.gate.outputs.go == 'yes'
        uses: actions/deploy-pages@v4
