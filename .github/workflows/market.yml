# The live desk. One long run loops for about 5 hours 40 minutes, reading real-time prices every 15 seconds and
# publishing a snapshot to the `data` branch about every 45 seconds. When it ends it starts the next run itself, so the
# desk keeps going without anyone watching. GitHub's own 5-minute timer is unreliable on a young repository, so it is
# only a backup starter here.
name: market-hours
on:
  schedule:
    - cron: "7 3-18 * * 1-5"       # backup starter, hourly on weekdays
    - cron: "7 */3 * * 0,6"        # weekends (crypto only)
  workflow_dispatch:
concurrency:
  group: desk-live
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write
jobs:
  run:
    runs-on: ${{ vars.ENGINE_RUNNER || 'ubuntu-latest' }}      # set ENGINE_RUNNER=self-hosted to run on your static-IP machine (needed for real orders)
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - run: echo "T0=$(date +%s)" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -q yfinance pandas numpy
      - name: Claude Code for the AI analysts (uses your Claude plan; skipped without CLAUDE_CODE_OAUTH_TOKEN)
        env: { T: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" }
        run: if [ -n "$T" ]; then npm install -g --silent @anthropic-ai/claude-code && claude --version; fi
      - name: Resume the live books from the data branch
        run: |
          if git fetch -q --depth=1 origin data 2>/dev/null; then
            for f in live_orders live_book desk_book trade_archive strategy_stats forecast_history participants forecast gateway company llm_usage news_digest day_review ipo ipo_state lab news_wire news_pulse_state; do git show FETCH_HEAD:$f.json > /tmp/r.json 2>/dev/null && mv /tmp/r.json docs/data/$f.json || true; done
          fi
      - name: Run the desks
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          UPSTOX_EXEC_TOKEN: ${{ secrets.UPSTOX_EXEC_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # optional: from `claude setup-token` on your own Claude plan; no API billing
          LLM_CALLS_5H: ${{ vars.LLM_CALLS_5H }}
          LLM_CALLS_DAY: ${{ vars.LLM_CALLS_DAY }}
          INDSTOCKS_TOKEN: ${{ secrets.INDSTOCKS_TOKEN }}          # optional, read-only use here: funds, margin and charges for the dry-run; orders cannot be sent from GitHub (no static IP)
          # the order desk (backend/executor.py): off unless EXEC_MODE is sandbox or live; every order waits for your approval
          EXEC_MODE: ${{ vars.EXEC_MODE }}
          EXEC_LIVE_CONFIRM: ${{ secrets.EXEC_LIVE_CONFIRM }}
          UPSTOX_SANDBOX_TOKEN: ${{ secrets.UPSTOX_SANDBOX_TOKEN }}
          EXEC_ALGO_NAME: ${{ vars.EXEC_ALGO_NAME }}
          EXEC_KILL: ${{ vars.EXEC_KILL }}
          EXEC_GATE: ${{ vars.EXEC_GATE }}
          EXEC_GATE_CONFIRM: ${{ vars.EXEC_GATE_CONFIRM }}
          EXEC_MAX_ORDER_RS: ${{ vars.EXEC_MAX_ORDER_RS }}
          EXEC_MAX_DAY_LOSS_RS: ${{ vars.EXEC_MAX_DAY_LOSS_RS }}
          EXEC_MAX_OPEN: ${{ vars.EXEC_MAX_OPEN }}
          EXEC_WALLET_USE: ${{ vars.EXEC_WALLET_USE }}
          EXEC_APPROVAL_MINUTES: ${{ vars.EXEC_APPROVAL_MINUTES }}
          EXEC_MAX_SLIP_PCT: ${{ vars.EXEC_MAX_SLIP_PCT }}
          EXEC_FILL_TIMEOUT_S: ${{ vars.EXEC_FILL_TIMEOUT_S }}
          EXEC_SANDBOX_WALLET_RS: ${{ vars.EXEC_SANDBOX_WALLET_RS }}
          GATEWAY_MODE: ${{ vars.GATEWAY_MODE }}
          LOOP_SECONDS: "20400"
        run: python backend/engine.py
      - name: Save state to the branch
        if: always()
        run: |
          git config user.name "desk-bot"; git config user.email "desk-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || { git commit -q -m "data: live desk state"; for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break || sleep 5; done; }
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with: { path: docs }
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ $(( $(date +%s) - T0 )) -gt 600 ]; then gh workflow run market.yml --ref "${{ github.ref_name }}"; else echo "run was short, not chaining"; fi
